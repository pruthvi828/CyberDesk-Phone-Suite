<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at center, #1a103c 0%, #080511 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            animation: pulse 2s infinite alternate;
        }
        h1 {
            font-size: 85px;
            margin: 0;
            background: linear-gradient(135deg, #FFD700 0%, #FF6B6B 50%, #4ECDC4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
            letter-spacing: 3px;
        }
        p {
            font-size: 32px;
            color: #a5b4fc;
            margin-top: 20px;
            font-weight: 500;
        }
        .badge {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 20px;
            color: #10B981;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class='container'>
        <h1>Hello Papa ❤️</h1>
        <p>Smart TV System Connected & Ready!</p>
        <div class='badge'>✨ 4K Fire TV Live ✨</div>
    </div>
</body>
</html>
