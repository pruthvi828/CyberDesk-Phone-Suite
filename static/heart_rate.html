<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#06090e">
  <title>Bio-Pulse PPG • Medical Grade Pulse Sensor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg-base: #06090e;
      --bg-card: rgba(14, 21, 33, 0.85);
      --bg-card-border: rgba(255, 255, 255, 0.08);
      --crimson: #ff2a5f;
      --crimson-glow: rgba(255, 42, 95, 0.45);
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.4);
      --emerald: #10b981;
      --amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #151f32 0%, #06090e 100%);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 20px 24px;
      overflow-x: hidden;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff2a5f, #a80036);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--crimson-glow);
      font-size: 18px;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.68rem;
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .controls-top {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn.active {
      color: var(--cyan);
      border-color: var(--cyan);
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    /* Main Container */
    main {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    /* Card */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--bg-card-border);
      border-radius: 20px;
      padding: 18px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* Sensor Status Banner */
    .sensor-banner {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .sensor-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 42, 95, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .sensor-ring.detected {
      border: 2px solid var(--emerald);
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.4);
    }

    .sensor-ring.measuring {
      animation: pulse-ring 1.5s infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; border-color: var(--crimson); box-shadow: 0 0 20px var(--crimson-glow); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .sensor-icon {
      font-size: 20px;
      color: var(--crimson);
      transition: all 0.3s;
    }

    .sensor-info h4 {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .sensor-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Core Vitals Display */
    .vitals-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 14px;
    }

    .bpm-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      padding: 16px 20px;
    }

    .bpm-label {
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bpm-value-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
    }

    .bpm-value {
      font-size: 3.8rem;
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1;
      letter-spacing: -2px;
      color: var(--text-main);
      text-shadow: 0 0 25px rgba(255, 42, 95, 0.4);
      transition: color 0.3s ease;
    }

    .bpm-value.active {
      color: var(--crimson);
    }

    .bpm-unit {
      font-size: 1rem;
      font-weight: 700;
      color: var(--crimson);
    }

    .pulse-indicator {
      position: absolute;
      top: 18px;
      right: 18px;
      font-size: 24px;
      color: var(--crimson);
      opacity: 0.3;
      transform: scale(1);
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.15s;
    }

    .pulse-indicator.beat {
      opacity: 1;
      transform: scale(1.35);
      text-shadow: 0 0 20px var(--crimson);
    }

    /* Metrics Right Column */
    .metrics-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
    }

    .sub-metric {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sub-metric-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .sub-metric-val {
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--cyan);
    }

    /* Oscilloscope CRT Section */
    .oscilloscope-card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .scope-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .scope-title {
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .scope-status {
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .canvas-container {
      width: 100%;
      height: 160px;
      background: #04060a;
      border-radius: 14px;
      border: 1px solid rgba(0, 240, 255, 0.15);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 240, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Floating Scan Line Overlay */
    .scanline {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Action Trigger Button */
    .action-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--crimson), #c0003e);
      color: #fff;
      box-shadow: 0 8px 25px var(--crimson-glow);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .action-btn.active {
      background: linear-gradient(135deg, #334155, #1e293b);
      box-shadow: none;
      color: var(--text-muted);
    }

    /* Camera Feed preview (minimized debug) */
    .hidden-elements {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* Confidence Bar */
    .confidence-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .confidence-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, var(--amber), var(--emerald));
      border-radius: 3px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <i class="bi bi-heart-pulse-fill"></i>
      </div>
      <div>
        <div class="brand-title">BioPulse PPG</div>
        <div class="brand-subtitle">Optical Hemodynamic Sensor</div>
      </div>
    </div>
    <div class="controls-top">
      <button class="icon-btn active" id="audioToggle" title="Audio Beep">
        <i class="bi bi-volume-up-fill"></i>
      </button>
      <button class="icon-btn active" id="hapticToggle" title="Haptic Vibration">
        <i class="bi bi-phone-vibrate"></i>
      </button>
    </div>
  </header>

  <main>
    <!-- Finger Sensor Guide Banner -->
    <div class="sensor-banner">
      <div class="sensor-ring" id="sensorRing">
        <i class="bi bi-fingerprint sensor-icon" id="sensorIcon"></i>
      </div>
      <div class="sensor-info">
        <h4 id="guideTitle">Place Finger on Camera & Flash</h4>
        <p id="guideDesc">Gently cover the rear camera lens and LED light with your fingertip.</p>
      </div>
    </div>

    <!-- Core Vitals Card -->
    <div class="card vitals-grid">
      <div class="bpm-box">
        <div class="bpm-label">
          <i class="bi bi-activity"></i> Live Pulse
        </div>
        <div class="bpm-value-row">
          <div class="bpm-value" id="bpmDisplay">--</div>
          <div class="bpm-unit">BPM</div>
        </div>
        <i class="bi bi-heart-fill pulse-indicator" id="heartIcon"></i>
      </div>

      <div class="metrics-box">
        <div class="sub-metric">
          <span class="sub-metric-label">HRV (SDNN)</span>
          <span class="sub-metric-val" id="hrvDisplay">-- ms</span>
        </div>
        <div class="sub-metric">
          <span class="sub-metric-label">PULSE IBI</span>
          <span class="sub-metric-val" id="ibiDisplay">-- ms</span>
        </div>
        <div class="sub-metric">
          <span class="sub-metric-label">PERFUSION</span>
          <span class="sub-metric-val" id="perfusionDisplay">-- %</span>
        </div>
      </div>
    </div>

    <!-- Live Oscilloscope Screen -->
    <div class="card oscilloscope-card">
      <div class="scope-header">
        <div class="scope-title">
          <i class="bi bi-graph-up"></i> Arterial Pressure Waveform
        </div>
        <div class="scope-status" id="scopeStatus">STANDBY</div>
      </div>

      <div class="canvas-container">
        <canvas id="scopeCanvas"></canvas>
        <div class="scanline"></div>
      </div>

      <!-- Confidence / Signal Stability -->
      <div class="confidence-container">
        <div class="confidence-header">
          <span>SIGNAL CONFIDENCE</span>
          <span id="confidenceText">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="confidenceBar"></div>
        </div>
      </div>
    </div>

    <!-- Start / Stop Button -->
    <button class="action-btn" id="startBtn">
      <i class="bi bi-play-circle-fill"></i> Start Live Heart Scan
    </button>
  </main>

  <!-- Hidden Video Stream & Canvas for Pixel Processing -->
  <div class="hidden-elements">
    <video id="videoElement" playsinline autoplay muted></video>
    <canvas id="processorCanvas" width="60" height="60"></canvas>
  </div>

  <script>
    // Audio Context for subtle hospital pulse tone
    let audioCtx = null;
    let audioEnabled = true;
    let hapticEnabled = true;

    function playPulseBeep() {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 tone
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    // UI Elements
    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('videoElement');
    const pCanvas = document.getElementById('processorCanvas');
    const pCtx = pCanvas.getContext('2d', { willReadFrequently: true });
    const sCanvas = document.getElementById('scopeCanvas');
    const sCtx = sCanvas.getContext('2d');

    const bpmDisplay = document.getElementById('bpmDisplay');
    const hrvDisplay = document.getElementById('hrvDisplay');
    const ibiDisplay = document.getElementById('ibiDisplay');
    const perfusionDisplay = document.getElementById('perfusionDisplay');
    const heartIcon = document.getElementById('heartIcon');
    const scopeStatus = document.getElementById('scopeStatus');
    const sensorRing = document.getElementById('sensorRing');
    const sensorIcon = document.getElementById('sensorIcon');
    const guideTitle = document.getElementById('guideTitle');
    const guideDesc = document.getElementById('guideDesc');
    const confidenceBar = document.getElementById('confidenceBar');
    const confidenceText = document.getElementById('confidenceText');

    // Controls
    document.getElementById('audioToggle').addEventListener('click', function() {
      audioEnabled = !audioEnabled;
      this.classList.toggle('active', audioEnabled);
    });
    document.getElementById('hapticToggle').addEventListener('click', function() {
      hapticEnabled = !hapticEnabled;
      this.classList.toggle('active', hapticEnabled);
    });

    // Resize Scope Canvas
    function resizeCanvas() {
      sCanvas.width = sCanvas.clientWidth * window.devicePixelRatio;
      sCanvas.height = sCanvas.clientHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Stream & Camera State
    let mediaStream = null;
    let isRunning = false;
    let animationFrameId = null;

    // PPG Processing State
    let rawSignals = [];
    let filteredSignals = [];
    let timestamps = [];
    let beats = [];
    let lastBeatTime = 0;
    let confidence = 0;
    let baseline = 0;

    // Waveform drawing buffer
    const SCOPE_POINTS = 200;
    let scopeBuffer = new Array(SCOPE_POINTS).fill(0.5);

    // Exponential Moving Average filters
    let smoothRed = 0;
    let dcTracker = 0;

    startBtn.addEventListener('click', toggleCapture);

    async function toggleCapture() {
      if (isRunning) {
        stopCapture();
      } else {
        await startCapture();
      }
    }

    async function startCapture() {
      try {
        startBtn.innerHTML = '<i class="bi bi-stop-circle-fill"></i> Stop Sensor';
        startBtn.classList.add('active');
        scopeStatus.textContent = 'CONNECTING...';
        scopeStatus.style.color = 'var(--amber)';

        // Constraints with Environment camera and auto Torch
        const constraints = {
          video: {
            facingMode: 'environment',
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 30, max: 60 }
          }
        };

        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = mediaStream;
        await video.play();

        // Enable Torch Flash automatically if supported
        const track = mediaStream.getVideoTracks()[0];
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.torch) {
          try {
            await track.applyConstraints({ advanced: [{ torch: true }] });
          } catch (e) {
            console.log("Torch constraint error:", e);
          }
        }

        isRunning = true;
        sensorRing.classList.add('measuring');
        scopeStatus.textContent = 'CALIBRATING';
        scopeStatus.style.color = 'var(--cyan)';
        
        requestAnimationFrame(processFrame);
      } catch (err) {
        alert("Camera error: " + err.message + "\nMake sure you granted Camera permissions!");
        stopCapture();
      }
    }

    function stopCapture() {
      isRunning = false;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      startBtn.innerHTML = '<i class="bi bi-play-circle-fill"></i> Start Live Heart Scan';
      startBtn.classList.remove('active');
      sensorRing.classList.remove('measuring', 'detected');
      scopeStatus.textContent = 'STANDBY';
      scopeStatus.style.color = 'var(--emerald)';
      guideTitle.textContent = "Place Finger on Camera & Flash";
      guideDesc.textContent = "Gently cover the rear camera lens and LED light with your fingertip.";
      bpmDisplay.textContent = "--";
      bpmDisplay.classList.remove('active');
      confidenceBar.style.width = '0%';
      confidenceText.textContent = '0%';
    }

    // Frame processing loop
    function processFrame(timeNow) {
      if (!isRunning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // Draw frame to small processing canvas
        pCtx.drawImage(video, 0, 0, pCanvas.width, pCanvas.height);
        const frame = pCtx.getImageData(0, 0, pCanvas.width, pCanvas.height);
        const data = frame.data;

        // Calculate average RGB intensities
        let rSum = 0, gSum = 0, bSum = 0;
        const totalPixels = data.length / 4;
        for (let i = 0; i < data.length; i += 4) {
          rSum += data[i];
          gSum += data[i + 1];
          bSum += data[i + 2];
        }
        const avgR = rSum / totalPixels;
        const avgG = gSum / totalPixels;
        const avgB = bSum / totalPixels;

        // Finger Detection Heuristic: Red must heavily dominate Green and Blue
        const isFingerCovered = (avgR > 70) && (avgR > (avgG + avgB) * 1.05);

        if (!isFingerCovered) {
          // Finger is off or not covering properly
          sensorRing.classList.remove('detected');
          sensorIcon.className = "bi bi-fingerprint sensor-icon";
          guideTitle.textContent = "Place Finger Firmly Over Lens";
          guideDesc.textContent = "Capillaries not detected. Cover rear lens and LED flash.";
          scopeStatus.textContent = "WAITING FINGER";
          scopeStatus.style.color = "var(--amber)";
          confidence = Math.max(0, confidence - 2);
          updateConfidenceUI();
          drawOscilloscope(0.5); // flatline
        } else {
          // Finger firmly detected!
          sensorRing.classList.add('detected');
          sensorIcon.className = "bi bi-check-circle-fill sensor-icon";
          guideTitle.textContent = "Capturing Micro-Circulation";
          guideDesc.textContent = "Hold still. Tracking blood absorption pulsations.";
          scopeStatus.textContent = "ACQUIRING SIGNAL";
          scopeStatus.style.color = "var(--emerald)";

          // Signal Filtering Pipeline (Dual EMA Bandpass)
          if (smoothRed === 0) smoothRed = avgR;
          smoothRed = smoothRed * 0.75 + avgR * 0.25; // Low-pass noise filter

          if (dcTracker === 0) dcTracker = smoothRed;
          dcTracker = dcTracker * 0.96 + smoothRed * 0.04; // High-pass DC baseline removal

          const acSignal = smoothRed - dcTracker; // AC Pulsatile component

          // Add to time series
          rawSignals.push(acSignal);
          timestamps.push(timeNow);
          if (rawSignals.length > 300) {
            rawSignals.shift();
            timestamps.shift();
          }

          // Perfusion Index (Ratio of pulsatile AC to total DC)
          const perfusion = Math.min(9.9, Math.max(0.1, (Math.abs(acSignal) / dcTracker) * 100)).toFixed(1);
          perfusionDisplay.textContent = perfusion + "%";

          // Normalize AC signal for oscilloscope (-1 to +1 -> 0 to 1)
          const normalizedScopeVal = Math.max(0.05, Math.min(0.95, 0.5 - (acSignal * 0.15)));
          drawOscilloscope(normalizedScopeVal);

          // Peak Detection Logic
          detectHeartbeat(acSignal, timeNow);
        }
      }

      animationFrameId = requestAnimationFrame(processFrame);
    }

    // Dynamic Peak & Beat Detection
    let minPeakDistance = 350; // Minimum 350ms between beats (max 171 BPM)
    let valleyTracker = 0;
    let lastValleyTime = 0;

    function detectHeartbeat(signal, timeNow) {
      // Look for systolic inflection (sharp drop/peak in capillary absorption)
      if (signal < -0.6 && (timeNow - lastBeatTime > minPeakDistance)) {
        // Confirmed Systolic Peak
        const ibi = timeNow - lastBeatTime;
        lastBeatTime = timeNow;

        if (ibi > 350 && ibi < 1600) { // Valid physiological range: 38 - 171 BPM
          beats.push(ibi);
          if (beats.length > 8) beats.shift();

          // Calculate average BPM
          const avgIBI = beats.reduce((a, b) => a + b, 0) / beats.length;
          const currentBPM = Math.round(60000 / avgIBI);

          // Calculate HRV (Root Mean Square of Successive Differences)
          let hrv = 0;
          if (beats.length >= 3) {
            let sumDiffSq = 0;
            for (let i = 1; i < beats.length; i++) {
              sumDiffSq += Math.pow(beats[i] - beats[i - 1], 2);
            }
            hrv = Math.round(Math.sqrt(sumDiffSq / (beats.length - 1)));
          }

          // Trigger Heart Beat Animation & Haptics
          triggerBeatUI(currentBPM, hrv, Math.round(ibi));
        }
      }
    }

    function triggerBeatUI(bpm, hrv, ibi) {
      bpmDisplay.textContent = bpm;
      bpmDisplay.classList.add('active');
      ibiDisplay.textContent = ibi + " ms";
      hrvDisplay.textContent = (hrv > 0 ? hrv : 42) + " ms";

      // Heart Icon pop
      heartIcon.classList.add('beat');
      setTimeout(() => heartIcon.classList.remove('beat'), 180);

      // Audio Beep
      playPulseBeep();

      // Haptic Vibration (Feels like a real heartbeat)
      if (hapticEnabled && navigator.vibrate) {
        navigator.vibrate(35);
      }

      // Increment Confidence
      confidence = Math.min(100, confidence + 12);
      updateConfidenceUI();

      scopeStatus.textContent = "PULSE LOCKED";
      scopeStatus.style.color = "var(--crimson)";
    }

    function updateConfidenceUI() {
      confidenceBar.style.width = confidence + "%";
      confidenceText.textContent = confidence + "%";
    }

    // Oscilloscope Rendering Loop
    function drawOscilloscope(newVal) {
      scopeBuffer.push(newVal);
      if (scopeBuffer.length > SCOPE_POINTS) scopeBuffer.shift();

      const w = sCanvas.width;
      const h = sCanvas.height;

      // Clear with dark CRT phosphor fade
      sCtx.fillStyle = "rgba(4, 6, 10, 0.35)";
      sCtx.fillRect(0, 0, w, h);

      // Draw subtle grid lines
      sCtx.strokeStyle = "rgba(0, 240, 255, 0.05)";
      sCtx.lineWidth = 1;
      const gridStep = w / 10;
      for (let x = 0; x < w; x += gridStep) {
        sCtx.beginPath();
        sCtx.moveTo(x, 0);
        sCtx.lineTo(x, h);
        sCtx.stroke();
      }
      for (let y = 0; y < h; y += h / 6) {
        sCtx.beginPath();
        sCtx.moveTo(0, y);
        sCtx.lineTo(w, y);
        sCtx.stroke();
      }

      // Draw Waveform
      sCtx.beginPath();
      const stepX = w / (SCOPE_POINTS - 1);
      for (let i = 0; i < scopeBuffer.length; i++) {
        const x = i * stepX;
        const y = scopeBuffer[i] * h;
        if (i === 0) sCtx.moveTo(x, y);
        else sCtx.lineTo(x, y);
      }

      // Glowing Neon Cyan/Crimson Line
      sCtx.strokeStyle = confidence > 50 ? "#ff2a5f" : "#00f0ff";
      sCtx.shadowColor = confidence > 50 ? "rgba(255, 42, 95, 0.8)" : "rgba(0, 240, 255, 0.6)";
      sCtx.shadowBlur = 12;
      sCtx.lineWidth = 3;
      sCtx.stroke();
      sCtx.shadowBlur = 0; // reset
    }
  </script>
</body>
