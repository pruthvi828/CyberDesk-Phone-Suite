name: Daily Open-Source Radar & Contribution Dispatch

on:
  schedule:
    # Runs automatically every single day at 04:30 AM UTC (10:00 AM IST)
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Web UI

permissions:
  contents: write

jobs:
  daily-scout-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Execute Autonomous Open-Source Scout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python backend/oss_scout.py

      - name: 🚀 Commit & Push Daily Contribution Digest
        run: |
          git config --global user.name "spidyy19"
          git config --global user.email "jadhavpruthvi828@gmail.com"
          git add open_source_workspace/*.md
          
          # Only commit if changes exist
          if git diff --staged --quiet; then
            echo "No new digest updates to commit today."
          else
            TODAY=$(date -u +"%Y-%m-%d")
            git commit -m "chore(radar): automated open-source contribution briefing for $TODAY [skip ci]"
            git push origin HEAD
            echo "🎉 Daily digest successfully pushed to GitHub!"
          fi
